# FraudStream local environment (SPEC §14.1).
#
# Profiles (pick one Kafka profile, they are mutually exclusive):
#   core    3 Kafka brokers in KRaft mode (RF=3, min.insync.replicas=2) + Postgres + kafka-ui
#   lowmem  1 Kafka broker (RF=1, min.insync.replicas=1) + Postgres + kafka-ui
#
# Run from the repository root: `docker compose --profile core up -d` (see compose.yaml).

x-kafka-image: &kafka-image apache/kafka:4.1.0

x-kafka-env: &kafka-env
  CLUSTER_ID: ${KAFKA_CLUSTER_ID:-a_KYMa1jRs-SL4G5wBm-ZA}
  KAFKA_PROCESS_ROLES: broker,controller
  KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
  KAFKA_LOG_DIRS: /var/lib/kafka/data
  # Topics are created explicitly by init-topics, never implicitly (SPEC §4.1).
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
  KAFKA_UNCLEAN_LEADER_ELECTION_ENABLE: 'false'
  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: '0'

x-kafka-3-broker-env: &kafka-3-broker-env
  <<: *kafka-env
  KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
  KAFKA_DEFAULT_REPLICATION_FACTOR: '3'
  KAFKA_MIN_INSYNC_REPLICAS: '2'
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: '3'
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: '3'
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: '2'

# Infrastructure comes back with the Docker daemon, like the application services.
x-restart: &restart unless-stopped

x-kafka-healthcheck: &kafka-healthcheck
  test:
    [
      'CMD-SHELL',
      '/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1',
    ]
  interval: 10s
  timeout: 10s
  retries: 12
  start_period: 20s

# Common settings of the application services (built from apps/, SPEC §3.1).
x-app: &app
  profiles: [core, lowmem]
  env_file:
    - path: ../.env
      required: true
  restart: unless-stopped

x-app-env: &app-env
  NODE_ENV: development
  DATABASE_HOST: postgres # .env URLs point at localhost; swap only the host inside compose
  KAFKA_BROKERS: kafka-1:9092
  MIGRATE_ON_START: 'true'

services:
  kafka-1:
    image: *kafka-image
    restart: *restart
    profiles: [core]
    hostname: kafka-1
    ports: ['19092:9094']
    environment:
      <<: *kafka-3-broker-env
      KAFKA_NODE_ID: '1'
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-1:9092,EXTERNAL://localhost:19092
    volumes: ['kafka-1-data:/var/lib/kafka/data']
    healthcheck: *kafka-healthcheck

  kafka-2:
    image: *kafka-image
    restart: *restart
    profiles: [core]
    hostname: kafka-2
    ports: ['29092:9094']
    environment:
      <<: *kafka-3-broker-env
      KAFKA_NODE_ID: '2'
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-2:9092,EXTERNAL://localhost:29092
    volumes: ['kafka-2-data:/var/lib/kafka/data']
    healthcheck: *kafka-healthcheck

  kafka-3:
    image: *kafka-image
    restart: *restart
    profiles: [core]
    hostname: kafka-3
    ports: ['39092:9094']
    environment:
      <<: *kafka-3-broker-env
      KAFKA_NODE_ID: '3'
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-3:9092,EXTERNAL://localhost:39092
    volumes: ['kafka-3-data:/var/lib/kafka/data']
    healthcheck: *kafka-healthcheck

  # Single broker for low-RAM machines. It answers on the same internal name (kafka-1)
  # and host port (19092) as the first core broker, so clients need no other config.
  kafka-lowmem:
    image: *kafka-image
    restart: *restart
    profiles: [lowmem]
    hostname: kafka-1
    networks:
      default:
        aliases: [kafka-1]
    ports: ['19092:9094']
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: '1'
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-1:9092,EXTERNAL://localhost:19092
      KAFKA_DEFAULT_REPLICATION_FACTOR: '1'
      KAFKA_MIN_INSYNC_REPLICAS: '1'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: '1'
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: '1'
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: '1'
    volumes: ['kafka-lowmem-data:/var/lib/kafka/data']
    healthcheck: *kafka-healthcheck

  # One-shot: creates every topic of SPEC §4.1 from kafka/topics.conf, then exits 0.
  # Replication factor and min.insync.replicas are derived from the live broker count.
  init-topics:
    image: *kafka-image
    profiles: [core, lowmem]
    entrypoint: ['/bin/bash', '/infra/kafka/init-topics.sh']
    environment:
      BOOTSTRAP_SERVERS: kafka-1:9092
    volumes: ['./kafka:/infra/kafka:ro']
    depends_on:
      kafka-1: { condition: service_healthy, required: false }
      kafka-2: { condition: service_healthy, required: false }
      kafka-3: { condition: service_healthy, required: false }
      kafka-lowmem: { condition: service_healthy, required: false }
    restart: 'no'

  postgres:
    image: postgres:16-alpine
    restart: *restart
    profiles: [core, lowmem]
    ports: ['5432:5432']
    env_file:
      - path: ../.env
        required: true
    environment:
      POSTGRES_DB: fraudstream
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?copy .env.example to .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/initdb.sh:/docker-entrypoint-initdb.d/10-initdb.sh:ro
      - ./postgres/init-roles.sql:/infra/postgres/init-roles.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d fraudstream']
      interval: 5s
      timeout: 5s
      retries: 20

  kafka-ui:
    image: kafbat/kafka-ui:v1.4.2
    restart: *restart
    profiles: [core, lowmem]
    ports: ['8080:8080']
    environment:
      KAFKA_CLUSTERS_0_NAME: fraudstream
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-1:9092
      DYNAMIC_CONFIG_ENABLED: 'false'
    depends_on:
      init-topics: { condition: service_completed_successfully }

  # The only component that ever sees a PAN. No `ports`: reachable only on the compose
  # network, by transaction-api (SPEC §6.2).
  card-vault:
    <<: *app
    image: fraudstream/card-vault:dev
    build:
      context: ..
      dockerfile: infra/docker/node-service.Dockerfile
      args: { APP: card-vault, MIGRATIONS: vault }
    environment:
      <<: *app-env
      PORT: '3001'
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3001/health/ready').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  # Public authorization API (SPEC §6.1).
  transaction-api:
    <<: *app
    image: fraudstream/transaction-api:dev
    build:
      context: ..
      dockerfile: infra/docker/node-service.Dockerfile
      args: { APP: transaction-api, MIGRATIONS: payments }
    ports: ['3000:3000']
    environment:
      <<: *app-env
      PORT: '3000'
      VAULT_URL: http://card-vault:3001
    depends_on:
      postgres: { condition: service_healthy }
      card-vault: { condition: service_healthy }
      init-topics: { condition: service_completed_successfully }
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health/ready').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  # Publishes payments.outbox to Kafka (SPEC §4.5). Safe to scale: one instance publishes
  # at a time (advisory-lock leader), the others stand by.
  outbox-relay-payments:
    <<: *app
    image: fraudstream/outbox-relay:dev
    build:
      context: ..
      dockerfile: infra/docker/node-service.Dockerfile
      args: { APP: outbox-relay }
    ports: ['9464:9464'] # Prometheus metrics
    environment:
      <<: *app-env
      MIGRATE_ON_START: 'false'
      RELAY_SCHEMA: payments
      RELAY_BATCH_SIZE: '500'
      RELAY_POLL_MS: '100'
    depends_on:
      transaction-api: { condition: service_healthy } # owns and migrates payments.outbox
      init-topics: { condition: service_completed_successfully }
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:9464/health/ready').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  kafka-1-data:
  kafka-2-data:
  kafka-3-data:
  kafka-lowmem-data:
  postgres-data:
