# Prometheus scrape config (SPEC §10). Every service exposes /metrics on its HTTP port
# (outbox-relay on its metrics port); kafka-exporter provides consumer group lag.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: services
    static_configs:
      - targets: ['card-vault:3001']
        labels: { app: card-vault }
      - targets: ['transaction-api:3000']
        labels: { app: transaction-api }
      - targets: ['outbox-relay-payments:9464']
        labels: { app: outbox-relay }
      - targets: ['fraud-rules:3002']
        labels: { app: fraud-rules }
      - targets: ['anomaly-scorer:3003']
        labels: { app: anomaly-scorer }
      - targets: ['decision-engine:3004']
        labels: { app: decision-engine }
      - targets: ['ledger:3005']
        labels: { app: ledger }
      - targets: ['alerts-gateway:3006']
        labels: { app: alerts-gateway }

  - job_name: kafka-exporter
    scrape_interval: 15s
    static_configs:
      - targets: ['kafka-exporter:9308']
