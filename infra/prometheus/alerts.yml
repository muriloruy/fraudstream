# Alert rules of SPEC §10. Not routed to a pager (no Alertmanager in the local stack): they
# show in Prometheus (Alerts page) and on the Grafana dashboards. Runbook: docs/runbook.md.
groups:
  - name: fraudstream
    rules:
      - alert: ConsumerLagHigh
        expr: sum by (consumergroup) (kafka_consumergroup_lag) > 10000
        for: 2m
        labels: { severity: warning }
        annotations:
          summary: 'Consumer group {{ $labels.consumergroup }} is {{ $value }} messages behind'
          runbook: docs/runbook.md#consumer-lag

      # Any message landing in a DLQ topic (<topic>.<group>.dlq, SPEC §4.6). The topic offsets
      # come from kafka-exporter, so this fires even if the consumer that wrote it is gone.
      - alert: DeadLetterMessages
        expr: sum by (topic) (increase(kafka_topic_partition_current_offset{topic=~".+\\.dlq"}[5m])) > 0
        labels: { severity: warning }
        annotations:
          summary: 'About {{ printf "%.0f" $value }} message(s) sent to {{ $labels.topic }} in the last 5 minutes'
          runbook: docs/runbook.md#dead-letter-messages

      - alert: OutboxStalled
        expr: max by (app, schema) (outbox_oldest_unpublished_seconds) > 30
        labels: { severity: critical }
        annotations:
          summary: 'Oldest unpublished {{ $labels.schema }}.outbox row is {{ $value }} s old'
          runbook: docs/runbook.md#outbox-not-publishing

      - alert: DecisionLatencyHigh
        expr: histogram_quantile(0.95, sum by (le) (rate(decision_latency_seconds_bucket[5m]))) > 1
        for: 2m
        labels: { severity: warning }
        annotations:
          summary: 'p95 decision latency is {{ $value }} s (target < 0.5 s, SPEC §11)'
          runbook: docs/runbook.md#slow-decisions
